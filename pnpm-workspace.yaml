packages:
  - examples/*
  - packages/*

allowBuilds:
  # pulled in by sass (examples/scss-vite); only used by the sass CLI's --watch,
  # and prebuilt platform packages make the native build unnecessary
  "@parcel/watcher": false
  "@vscode/vsce-sign": false
  esbuild: true
  keytar: false

minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"

overrides:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest: 5.0.3
